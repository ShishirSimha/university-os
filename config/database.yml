# PostgreSQL. Application tables live in the `library` schema
# of the `university_os` database.
#
# Local defaults match the existing Postgres server (postgres/postgres).
# Override with UNIVERSITY_OS_DATABASE_* in other environments.

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_HOST") %>
  port: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_PORT") %>
  username: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_USERNAME") %>
  password: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_PASSWORD") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_NAME") %>
  schema_search_path: library

test:
  <<: *default
  database: university_os_test
  schema_search_path: library

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_NAME") %>
    schema_search_path: library
  cache:
    <<: *default
    database: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_NAME") %>
    schema_search_path: public
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_NAME") %>
    schema_search_path: public
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("UNIVERSITY_OS_DATABASE_NAME") %>
    schema_search_path: public
    migrations_paths: db/cable_migrate
